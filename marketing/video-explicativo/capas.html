<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Capas del vídeo SAREBIDEA</title>
<style>
@font-face{font-family:"Instrument Serif";font-weight:400;src:url("../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2") format("woff2")}

:root{--ink:#07080d;--paper:#f5f6f9;--blue:#4db3ff;--brand:#0A93F5}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;-webkit-font-smoothing:antialiased}
.layer{position:relative;width:1080px;height:1920px;overflow:hidden}
/* Fondo */
#bg{background:radial-gradient(120% 70% at 50% 40%,#10131f 0%,#07080d 70%)}
#bg .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.075) 1.4px,transparent 1.6px);background-size:36px 36px;-webkit-mask-image:radial-gradient(70% 55% at 50% 45%,#000 20%,transparent 80%)}
#bg .ring{position:absolute;left:50%;top:965px;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;border:1.5px solid rgba(77,179,255,.10)}
#bg .ring.r2{width:1050px;height:1050px;margin:-525px 0 0 -525px;border-color:rgba(77,179,255,.14)}
#bg .ring.r3{width:2000px;height:2000px;margin:-1000px 0 0 -1000px;border-color:rgba(77,179,255,.06)}
#bg .floor{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(180deg,transparent,rgba(77,179,255,.10))}
#bg .grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay}
.glow{width:1400px;height:1400px;border-radius:50%}
#g1{background:radial-gradient(closest-side,rgba(77,179,255,.55),rgba(77,179,255,.18) 45%,transparent)}
#g2{background:radial-gradient(closest-side,rgba(15,111,184,.6),rgba(15,111,184,.2) 45%,transparent)}
/* Marco del móvil (hueco transparente para la grabación) */
#frame .phone{position:absolute;left:258.5px;top:432px;width:563px;height:1183px;border-radius:72px;border:16px solid #0d0f16;
  box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 0 3px rgba(0,0,0,.6),inset 0 0 0 1.5px rgba(255,255,255,.08)}
#frame .btn{position:absolute;width:5px;border-radius:3px;background:#1b1e29}
/* Textos */
.logo{position:absolute;left:0;right:0;top:92px;display:flex;justify-content:center;align-items:baseline;font:800 46px/1 "Montserrat",sans-serif;letter-spacing:.01em;color:var(--paper)}
.logo svg{height:32.5px;width:auto;margin:0 1.5px}
.head{position:absolute;left:60px;right:60px;top:176px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.eyebrow{font:600 26px "Funnel Display",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
h1{font:400 92px/0.98 "Instrument Serif",Georgia,serif;letter-spacing:-.02em;color:#fff;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.5)}
h1 em{font-style:italic;color:var(--blue)}
.foot{position:absolute;left:60px;right:60px;top:1652px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.sub{font:500 38px/1.3 "Geist",sans-serif;white-space:nowrap;color:rgba(245,246,249,.92);padding:20px 36px;border-radius:999px;background:rgba(13,16,26,.72);border:1.5px solid rgba(77,179,255,.35);box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
.cta{display:inline-flex;align-items:center;gap:18px;font:600 50px "Funnel Display",sans-serif;color:#07080d;background:var(--blue);padding:26px 54px;border-radius:22px;box-shadow:0 24px 60px -18px rgba(77,179,255,.9)}
</style></head><body>
<div class="layer" id="bg"><div class="ring r3"></div><div class="ring"></div><div class="ring r2"></div><div class="dots"></div><div class="floor"></div>
<svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg></div>
<div class="layer glow" id="g1" style="width:1400px;height:1400px"></div>
<div class="layer glow" id="g2" style="width:1400px;height:1400px"></div>
<div class="layer" id="frame"><div class="logo" id="flogo"></div><div class="phone"></div>
  <div class="btn" style="left:253px;top:672px;height:90px"></div><div class="btn" style="left:253px;top:782px;height:90px"></div><div class="btn" style="left:822px;top:722px;height:140px"></div></div>
<div id="caps"></div>
<script>
const LOGO='S<svg viewBox="0 0 100 100"><path d="M0 100 37 0h26l37 100H74L50 33 26 100Z" fill="#0A93F5"/></svg>REBIDE<svg viewBox="0 0 100 100"><path d="M0 100 37 0h26l37 100H74L50 33 26 100Z" fill="#0A93F5"/></svg>'
const scenes=[
 ['Diseño web para negocios locales','La web que tu negocio <em>necesita.</em>','Más clientes, más confianza, más visibilidad'],
 ['Servicios','Todo lo que tu web <em>necesita</em>','Diseño · Móvil · SEO local · Mantenimiento'],
 ['Quién soy','Detrás de SAREBIDEA, <em>Unai</em>','Webs rápidas, sencillas y sin rodeos'],
 ['Cómo funciona','Tú a lo tuyo. <em>Nosotros</em>, a lo demás.','3 pasos · Tu web lista en 1 semana'],
 ['Ejemplos','Así podría verse tu <em>negocio</em>','Webs reales para cada sector'],
 ['Preguntas frecuentes','Respuestas claras, <em>sin letra pequeña</em>','Precio, plazos, dominio y mantenimiento'],
 ['Empieza hoy','Propuesta visual <em>gratis</em>','Sin compromiso · Respuesta en menos de 24 h',true],
]
const caps=document.getElementById('caps');document.getElementById('flogo').innerHTML=LOGO
scenes.forEach(([e,h,s,cta],i)=>{caps.insertAdjacentHTML('beforeend',`<div class="layer" id="c${i}"><div class="head"><span class="eyebrow">${e}</span><h1>${h}</h1></div><div class="foot"><span class="sub">${s}</span>${cta?'<span class="cta"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.6 4 5.6 4 9s-1.2 6.4-4 9c-2.8-2.6-4-5.6-4-9s1.2-6.4 4-9Z"/></svg>sarebidea.com</span>':''}</div></div>`)})
</script></body></html>
