              {
                "@type": "Question",
                "name": "¿Cuánto tarda en estar lista mi web?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "En 1 semana desde nuestra llamada de 15 minutos. Te damos la fecha de entrega concreta antes de empezar."
                }
              },
              {
                "@type": "Question",
                "name": "¿Tengo que aportar los textos y fotografías?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Escribimos los textos a partir de nuestra conversación y te ayudamos con las imágenes. Si tienes fotos propias, mejor; si no, usamos imágenes de calidad o organizamos una sesión."
                }
              },
              {
                "@type": "Question",
                "name": "¿La web funciona en móvil?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí, y no como versión reducida: la diseñamos primero para el móvil, porque es desde donde te buscan la mayoría de tus clientes."
                }
              },
              {
                "@type": "Question",
                "name": "¿Incluye dominio y hosting?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Nos encargamos de registrar tu dominio y alojar la web durante el primer año. Si ya tienes dominio, lo conectamos sin coste."
                }
              },
              {
                "@type": "Question",
                "name": "¿Puedo modificar la web después?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Claro. Puedes pedirnos cambios cuando quieras, y si prefieres hacerlos tú, te dejamos un panel sencillo para editar textos, horarios y fotos."
                }
              },
              {
                "@type": "Question",
                "name": "¿Hacéis mantenimiento?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Actualizaciones, seguridad, copias de seguridad y pequeños cambios. Tu web siempre funcionando sin que tengas que pensar en ello."
                }
              },
              {
                "@type": "Question",
                "name": "¿Está optimizada para Google?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Cuidamos la velocidad, la estructura y el SEO local, y configuramos tu ficha de Google Business para que te encuentren quienes buscan cerca de ti."
